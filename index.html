    body = top('Insta') + `<div class="pscroll">` + (posts.map(m => `<div class="post"><div class="who" style="color:${(CT[m.from] || {}).color}">${esc((CT[m.from] || { name: m.from }).name)}</div>${m.media ? photoHTML(m.media) : ''}<div>${esc(m.text)}</div><div class="muted" style="font-size:11px">${fmtClock(m.t)}</div></div>`).join('') || '<p class="muted">Nothing new.</p>') + '</div>';
  } else if (sc === 'haya') {
    const pct = clamp(S.money / C.tripTarget * 100, 0, 100), shopOpen = S.slot === 'morning' || S.slot === 'evening';
    body = top('HayaEats') + `<div class="pscroll"><div><b>Trip fund</b> ${yen(S.money)} / ${yen(C.tripTarget)}<div class="savebar"><div style="width:${pct}%"></div></div></div>
      ${S.slot === 'shift' && world ? `<div class="post">Job ${Math.min(world.cur + 1, 3)}/3 · ${world.dif.label}</div>` : ''}
      <h3 style="margin:8px 0 2px">Gifts &amp; gear ${shopOpen ? '' : '<span class="muted">(closed during shifts)</span>'}</h3>
      <div class="muted" style="font-size:12px">Gifts arrive at her flat the next day.</div>
      ${GD.shop.filter(i => !i.minE || S.meters.E >= i.minE).map(i => `<div class="shopitem"><div><b>${esc(i.name)}</b><div class="muted" style="font-size:12px">${esc(i.desc)}</div></div>
        <button data-buy="${i.id}" ${!shopOpen || S.money < i.price || S.gifts.includes(i.id) ? 'disabled' : ''}>${S.gifts.includes(i.id) ? 'Bought' : yen(i.price)}</button></div>`).join('')}</div>`;
  }
  phoneEl.innerHTML = bar + `<div class="pbody">${body}</div>`;
  const cs = $('chatScroll'); if (cs) cs.scrollTop = cs.scrollHeight;
}
function nextUpHTML() {
  const left = (hhmm) => { const d = Math.max(0, hm(hhmm) - S.clock); return d < 60 ? 'now' : `in ${Math.floor(d / 3600) ? Math.floor(d / 3600) + 'h ' : ''}${Math.floor(d % 3600 / 60)}m`; };
  if (S.slot === 'morning') return `<br><span style="font-size:11px">🛵 shift 13:00 · ${left('13:00')}</span>`;
  if (S.slot === 'evening') return `<br><span style="font-size:11px">😴 bed 23:30 · ${left('23:30')}</span>`;
  return '';
}
function renderTypingPill() {
  const el = $('typingPill'); if (!el || !S) return;
  const t = S.phone.open && !phoneEl.classList.contains('glance') ? [] : typingChats().filter(c => c !== 'HayaEats');
  const html = t.length ? `${esc((CT[t[0]] || { name: t[0] }).name)} is typing<span class="dots"><i></i><i></i><i></i></span>` : '';
  if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; el.style.display = html ? 'block' : 'none'; }
}
function top(title, sub) { return `<div class="ptop"><button class="back" data-go="${S.phone.screen.startsWith('chat:') ? 'chats' : 'home'}">‹</button><div class="title">${esc(title)}${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`; }
function photoHTML(md) { return `<div class="photo"><b>📷 ${esc(md.id)}</b>${esc(md.caption || '')}</div>`; }
function msgHTML(m) {
  if (m.sys) return `<div class="msg sys">${esc(m.text)}</div>`;
  return `<div class="msg ${m.me ? 'me' : ''}">${m.media ? photoHTML(m.media) : ''}${esc(m.text)}<div class="t">${fmtClock(m.t)}${m.me ? ' · 既読' : ''}${m.resolved === 'missed' ? ' · missed' : ''}</div></div>`;
}
function choicesHTML(list) {
  const m = list.slice().reverse().find(x => !x.me && x.beat && (x.kind === 'key' || x.kind === 'minor') && !x.resolved);
  if (!m) return '';
  const b = findBeat(m.beat); if (!b) return '';
  const safe = isSafe(), chs = b.tier === 'key' ? choicesFor(b) : b.choices;
  let lbl = b.tier === 'key' ? (b.pivotal ? '🔴 Big moment' : '🔴 She\'s waiting for an answer') : '';
  if (b.tier === 'minor') { const mi = S.minors.find(x => x.beat === b.id); if (mi && mi.deadline) lbl = `<span class="ring">🟡 reply soon · ${Math.max(0, Math.ceil(mi.deadline - S.rt))}s</span>`; }
  return `<div class="choices ${b.pivotal ? 'pivotal' : ''}"><div class="lbl">${lbl}</div>` + chs.map((c, i) =>
    `<button data-ans="${b.id}" data-i="${i}" ${safe ? '' : 'disabled'}>${safe ? esc(c.text) : 'Pull over to reply 🚲'}</button>`).join('') + '</div>';
}
function slotActionsHTML() {
  if (S.slot === 'morning') return `<button class="primary" data-a="work" style="width:100%" ${canLeaveMorning() ? '' : 'disabled'}>${slotScriptDone() ? "It's 13:00, start your shift 🛵" : 'Go to work 🛵'}</button><p class="muted" style="font-size:12px">${canLeaveMorning() ? (S.pending ? 'Yui is still waiting on an answer. You can reply on a stop during the shift.' : '') : 'Your morning texts are still coming in…'}</p>`;
  if (S.slot === 'evening') return `<button class="primary" data-a="sleep" style="width:100%" ${canSleep() ? '' : 'disabled'}>Sleep 😴</button>
    <p class="muted" style="font-size:12px">${canSleep() ? '' : (S.pending || S.keyQueue.length) ? "Yui's waiting for an answer." : 'Evening texts are still coming in…'}</p>
    ${S.lateDone ? '' : '<button data-a="late" style="width:100%">Take a late shift (pay ×0.6, Yui notices)</button>'}`;
  return '';
}
function canLeaveMorning() {
  if (S.slot !== 'morning') return false; if (slotScriptDone()) return true;
  const q = S.q, beats = day().morning.beats; return q.blocked && !beats.slice(q.idx).some(b => b.tier === 'key');
}
function canSleep() { return S.slot === 'evening' && slotScriptDone() && !S.pending && !S.keyQueue.length && !S.outbox.length; }

phoneEl.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-a],[data-ans],[data-buy]'); if (!t) return;
  if (t.dataset.go) { S.phone.screen = t.dataset.go; clearUnread(); renderPhone(true); }
  else if (t.dataset.ans) answer(t.dataset.ans, +t.dataset.i);
  else if (t.dataset.buy) buy(t.dataset.buy);
  else slotAction(t.dataset.a);
});
function slotAction(a) {
  if (a === 'close') closePhone();
  else if (a === 'work') toShiftSelect(false);
  else if (a === 'late') toShiftSelect(true);
  else if (a === 'sleep') sleep();
  else if (a === 'phone') openPhone();
}
function buy(id) {
  const it = GD.shop.find(i => i.id === id); if (!it || S.money < it.price || !(S.slot === 'morning' || S.slot === 'evening')) return;
  S.money -= it.price; S.spent += it.price; S.gifts.push(id); S.flags['gift_' + id] = true; if (id === 'mount') S.flags.mount = true;
  addM(it.d, 'gift ' + id);
  sendFrom('HayaEats', it.self ? `${it.name} fitted. Ride safe!` : `${it.name} ordered for Yui. It arrives at her flat tomorrow.`, { kind: 'ambient' });
  save(); renderPhone(true);
}

/* ---------- slot flow ---------- */
function toMorning() {
  S.slot = 'morning'; S.clock = hm(day().morning.startClock); startQueue('morning');
  openPhone('home'); renderControls(); save();
}
function toShiftSelect(late) {
  if (!late) leaveSlot(); else { S.eveClock = S.clock; S.eveningQ = S.q; }
  S.slot = late ? 'evening' : 'shift_select';
  const ds = C.difficulties;
  showOverlay(`<h2>🛵 HayaEats ${late ? 'late shift' : 'afternoon shift'}</h2>
    <p class="muted">3 customers, one 2:00 timer. Each job pays by how fast you reach it. Anyone you don't reach pays ¥0. Yui keeps texting; stopping to reply costs time.${late ? ' Late shift pays ×0.6.' : ''}</p>
    <div class="diff">${Object.keys(ds).map(k => `<button data-d="${k}"><b>${ds[k].label}</b> · up to ${yen(ds[k].maxPay * 3 * (late ? C.lateShift.mult : 1))}<br><span class="muted">${ds[k].desc} · par ${ds[k].par}s/leg</span></button>`).join('')}</div>
    <p class="muted" style="font-size:13px">Controls: joystick or WASD/arrows to ride. STOP button (or E/Space) brakes, then gets off the bike. Walk into the yellow ring to hand over. 📱 (or P) opens the phone; you can read while riding, but you can only reply when you're stopped or on foot.</p>
    ${late ? '<button data-d="cancel" style="width:100%">Never mind</button>' : ''}`);
  ocard.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { if (b.dataset.d === 'cancel') { hideOverlay(); return; } startShift(b.dataset.d, late); });
  renderControls(); save();
}
function toEvening(fromLate) {
  hideOverlay(); S.slot = 'evening';
  if (!fromLate) { S.clock = Math.max(S.clock, hm(day().evening.startClock)); startQueue('evening'); }
  else { S.clock = S.eveClock ?? S.clock; if (S.eveningQ) { S.q = S.eveningQ; S.q.segFrom = S.clock; S.q.segReal = 0; } }
  openPhone('home'); renderControls(); save();
}
function sleep() {
  if (!canSleep()) return;
  const before = { ...S.meters };
  addM({ I: -2 }, 'story drift CP1'); addM({ N: -5 }, 'sleep decay');
  const ev = evalRoute(); S.routeEval = ev;
  if (ev !== S.route) S.flags.route_warning = ev; // §16.4: deferred one checkpoint, warn in D2
  S.flags.cp1 = S.route; S.flags.desp_cause = despCause();
  const dom = dominantType();
  const refMap = { wholesome: 'Naive', forgiving: 'Guilt', encouraging: 'Encouraged', cold: 'Desperate_absent', jealous: 'Desperate_smothered' };
  const refKey = S.route === 'Desperate' ? 'Desperate_' + despCause() : (ev !== 'Naive' && dom ? refMap[dom] : S.route);
  S.reflection = GD.reflections[refKey] || GD.reflections.Naive;
  S.slot = 'summary'; S.phone.open = false; save(); showSummary(); renderControls();
}
function showSummary() {
  const m = S.meters, s0 = S.startMeters;
  const row = k => { const d = m[k] - s0[k]; return `<tr><td>${{ L: 'Love', I: 'Innocence', E: 'Encourage', N: 'Neglect' }[k]}</td><td>${s0[k]} → <b>${m[k]}</b></td><td class="${(k === 'N' ? -d : d) > 0 ? 'good' : d !== 0 ? 'bad' : ''}">${d > 0 ? '+' : ''}${d}</td></tr>`; };
  const lean = { Naive: S.lean.wholesome, Guilt: S.lean.forgiving, Encouraged: S.lean.encouraging, Desperate: S.lean.cold + S.lean.jealous };
  showOverlay(`<h2>🌙 End of Day 1</h2><p><i>"${esc(S.reflection)}"</i></p>
    <table class="sum">${S.shifts.map(s => `<tr><td>${s.late ? 'Late' : 'Afternoon'} shift (${s.diff})</td><td colspan="2">${yen(s.total)}</td></tr>`).join('')}
    <tr><td>Earned</td><td colspan="2" class="good">${yen(S.earned)}</td></tr><tr><td>Spent</td><td colspan="2" class="bad">${yen(S.spent)}</td></tr>
    <tr><td>Trip fund</td><td colspan="2"><b>${yen(S.money)}</b> / ${yen(C.tripTarget)}</td></tr></table>
    <h3 style="margin:10px 0 2px">Meters</h3><table class="sum">${['L', 'I', 'E', 'N'].map(row).join('')}</table>
    <p>Route at CP1: <b>${S.route}</b>${S.routeEval !== S.route ? ` <span class="bad">(drifting toward ${S.routeEval}; you'll get a warning on Day 2)</span>` : ''}</p>
    <p class="muted" style="font-size:13px">Lean: Naive ${lean.Naive} · Guilt ${lean.Guilt} · Encouraged ${lean.Encouraged} · Desperate ${lean.Desperate} · Protective 🛡️ ${S.lean.protective} (no route weight)</p>
    <p class="muted">Day 2 isn't built yet.</p>
    <div class="row"><button class="primary" id="again">Play Day 1 again</button></div>`);
  $('again').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); world = null; hideOverlay(); toMorning(); };
}
function showOverlay(html) { ocard.innerHTML = html; ov.style.display = 'flex'; }
function hideOverlay() { ov.style.display = 'none'; }

/* ---------- controls ---------- */
function renderControls() {
  if (!S) return;
  const inShift = S.slot === 'shift' && world && !world.done;
  $('pad').style.display = inShift ? 'block' : 'none';
  $('actBtn').style.display = inShift ? 'block' : 'none';
  $('phoneBtn').style.display = (inShift || (S.slot !== 'title' && S.slot !== 'summary' && S.slot !== 'shift_select')) ? 'block' : 'none';
  if (inShift) { ctrl.innerHTML = ''; return; }
  if (S.slot === 'morning' || S.slot === 'evening') ctrl.innerHTML = `<button class="primary" data-a="phone">📱 Open phone</button>`;
  else ctrl.innerHTML = '';
}
ctrl.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t) slotAction(t.dataset.a); });
function updateActBtn() {
  if (!world || world.done) return; const p = world.p, b = $('actBtn');
  const lbl = p.handover > 0 ? 'HANDING OVER' : p.onFoot ? (Math.hypot(p.x - p.bx, p.y - p.by) < 40 ? 'GET ON BIKE' : 'WALK…') : p.speed >= 5 ? 'STOP' : 'GET OFF';
  if (b.textContent !== lbl) { b.textContent = lbl; b.style.background = lbl === 'STOP' ? '#c0392b' : lbl === 'GET OFF' ? '#2e86de' : '#27ae60'; }
}
$('actBtn').addEventListener('pointerdown', e => { e.preventDefault(); action(); });
$('phoneBtn').addEventListener('click', () => { S.phone.open ? closePhone() : openPhone(); });
const pad = $('pad'), knob = $('knob');
function padMove(e) {
  const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2, d = Math.hypot(dx, dy), k = d > max ? max / d : 1;
  joy.x = dx * k / max; joy.y = dy * k / max; if (Math.hypot(joy.x, joy.y) < 0.15) joy.x = joy.y = 0;
  knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); joy.on = true; padMove(e); });
pad.addEventListener('pointermove', e => { if (joy.on) padMove(e); });
const padEnd = () => { joy.on = false; joy.x = joy.y = 0; knob.style.transform = ''; };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
document.addEventListener('touchmove', e => { if (!e.target.closest('.pscroll,.choices,.card,#debug')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = true;
  if (k === '`' || k === 'F2') { toggleDebug(); e.preventDefault(); }
  else if (k === 'p' || k === 'Tab') { if (S && S.slot !== 'title') { S.phone.open ? closePhone() : openPhone(); } e.preventDefault(); }
  else if (k === 'e' || k === ' ') { action(); e.preventDefault(); }
  else if (k === 'Escape') { paused = !paused; if (paused) showOverlay('<h2>⏸ Paused</h2><p class="muted">The world and timers are frozen. Press Esc or tap to resume.</p><button class="primary" id="unp" style="width:100%">Resume</button>'), $('unp').onclick = () => { paused = false; hideOverlay(); renderPhone(true); }; else hideOverlay(); renderPhone(true); }
  if (k.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

/* ---------- debug ---------- */
let debugOn = false;
const dbgEl = $('debug'), dbgBtn = $('debugBtn');
dbgEl.innerHTML = '<button id="dbgClose" data-dbg="close" aria-label="Close debug">✕ Close</button><div id="dbgBody"></div>';
function setDebug(on) { debugOn = on; dbgEl.style.display = on ? 'block' : 'none'; renderDebug(); }
function toggleDebug() { setDebug(!debugOn); }
// 🐞 opens on long-press (0.5 s) so it's never hit by accident; a quick tap closes it if it's open.
let lpTimer = null, lpFired = false;
dbgBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); lpFired = false;
  if (debugOn) { setDebug(false); lpFired = true; return; }
  lpTimer = setTimeout(() => { lpFired = true; setDebug(true); }, 500); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => dbgBtn.addEventListener(ev, () => clearTimeout(lpTimer)));
dbgBtn.addEventListener('contextmenu', e => e.preventDefault());
// tap outside the panel closes it (and the tap is swallowed so it doesn't hit the game)
document.addEventListener('pointerdown', e => {
  if (!debugOn || dbgEl.contains(e.target) || dbgBtn.contains(e.target)) return;
  e.preventDefault(); e.stopPropagation(); setDebug(false);
  const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
  document.addEventListener('click', swallow, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', swallow, true), 400);
}, true);
// panel actions on pointerdown via delegation (the body re-renders, so per-button handlers get lost on iOS)
dbgEl.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-dbg]'); if (!t) return; e.preventDefault();
  const a = t.dataset.dbg;
  if (a === 'close') setDebug(false);
  else if (a === 'skip') skipAhead();
  else if (a === 'reset') { localStorage.removeItem(SAVE_KEY); location.reload(); }
});
function skipAhead() { // jump to the next thing: land anything being typed and end the current gap
  S.outbox.forEach(e => { e.due = S.rt; e.segs = []; }); if (S.q) S.q.segReal = 1e6; landOutbox();
}
function renderDebug() {
  if (!debugOn || !S) return;
  const m = S.meters, bar = (k, c) => `${k} ${m[k]} <span style="color:#888">(start ${S.startMeters[k]}, ${m[k] - S.startMeters[k] >= 0 ? '+' : ''}${m[k] - S.startMeters[k]})</span><div class="bar"><div style="width:${m[k]}%;background:${c}"></div></div>`;
  const p = S.pending;
  $('dbgBody').innerHTML = `<b>DEBUG</b> · ${S.slot} · ${fmtClock(S.clock)} · rt ${S.rt.toFixed(0)}s · safe:${isSafe()}<br>
    ${bar('L', '#f7a1c4')}${bar('I', '#a7c7ff')}${bar('E', '#ffb36b')}${bar('N', '#999')}
    route_now: <b>${S.route}</b> · rules say: <b>${evalRoute()}</b> · desp_cause: ${despCause()}<br>
    lean → Naive ${S.lean.wholesome} · Guilt ${S.lean.forgiving} · Enc ${S.lean.encouraging} · Desp ${S.lean.cold + S.lean.jealous} (cold ${S.lean.cold}/jealous ${S.lean.jealous}) · 🛡️ ${S.lean.protective} (no weight)<br>
    money ${yen(S.money)} · earned ${yen(S.earned)} · spent ${yen(S.spent)}<br>
    pending key: ${p ? `${p.beat} ${p.fired ? 'shown' : 'waiting for a stop'} · wait ${(S.rt - p.readyRt).toFixed(0)}s · steps ${p.steps}` : '—'}<br>
    typing: ${typingChats().join(', ') || '—'} · composing ${S.outbox.length}<br>
    queued keys: ${S.keyQueue.join(', ') || '—'} · open minors: ${S.minors.map(x => x.beat + (x.deadline ? '(' + Math.ceil(x.deadline - S.rt) + 's)' : '')).join(', ') || '—'}<br>
    flags: ${esc(JSON.stringify(S.flags))}<br>
    <div class="row" style="margin:8px 0"><button data-dbg="skip">⏭ Skip wait</button><button data-dbg="reset">Reset save</button></div>
    <div style="color:#aaa">${S.log.slice(-12).reverse().map(esc).join('<br>')}</div>`;
}

/* ---------- title ---------- */
function title() {
  S = S || newState();
  const saved = load();
  showOverlay(`<h2>Last Train Home</h2><p class="muted">Day 1 · Move-in. Yui's moving to Tokyo for uni. You're staying in Minase, doing HayaEats deliveries to save ${yen(C.tripTarget)} so you can visit her.</p>
    <p class="muted" style="font-size:13px">Personal prototype. Placeholder art. Progress saves on this device.</p>
    <p class="muted" style="font-size:11px;opacity:.7" id="buildStamp">2026-10-16 07:43 BST · day1 web</p>
    <div class="diff">${saved && saved.slot !== 'title' ? '<button class="primary" id="cont">Continue</button>' : ''}<button ${saved && saved.slot !== 'title' ? '' : 'class="primary"'} id="newg">New game</button></div>`);
  if ($('cont')) $('cont').onclick = () => { S = saved; resume(); };
  $('newg').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); hideOverlay(); toMorning(); };
}
function resume() {
  hideOverlay();
  if (S.slot === 'shift' || S.slot === 'shift_select') { S.slot = 'shift_select'; S.q = null; toShiftSelect(false); return; } // a shift restarts on reload
  if (S.slot === 'summary') { showSummary(); renderControls(); return; }
  renderPhone(true); renderControls();
}

/* ---------- main loop ---------- */
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (S && !paused && ov.style.display !== 'flex') {
    if (S.slot === 'morning' || S.slot === 'evening' || S.slot === 'shift') {
      S.rt += dt; if (S.slot === 'shift') tickShift(dt);
      tickQueue(dt); tickTimers(); landOutbox();
    }
  }
  if (S && S.slot === 'evening' && S.q && S.q.slot === 'evening') S.eveningQ = S.q;
  if (world) updateActBtn();
  draw();
  renderTypingPill(); uiTimer += dt; if (uiTimer > 0.25) { uiTimer = 0; renderPhone(); renderDebug(); }
  saveTimer += dt; if (saveTimer > 3) { saveTimer = 0; if (S && S.slot !== 'title') save(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
window.__game = { skipAhead, tickShift, get S() { return S; }, get world() { return world; }, answer, action, startShift, sleep, toShiftSelect, keys, joy };
resize(); title(); requestAnimationFrame(frame);
})();

</script>
