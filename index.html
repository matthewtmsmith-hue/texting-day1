window.GAME_DATA = {
  config: {
    shiftGameSecPerReal: 20,          // shift only: 1 real second = 20 in-game seconds (the 2:00 timer is real time)
    // Morning/Evening clock: no fixed rate. Each slot's clock runs from startClock to endClock and is scaled so
    // the LAST text of the slot lands exactly at endClock (13:00 shift start, 23:30 bedtime). See slot fields below.
    pacing: {
      secPerDelay: 6,          // real seconds per 1 unit of a beat's `delay` (beats can override with gapSec)
      typeSecPerChar: 0.045, typeMin: 1.2, typeMax: 5,   // how long the typing bubble shows
      hesTypeSec: [0.8, 1.8], hesGapSec: [1.2, 3],      // hesitation: start typing, stop, start again
      holdMarginMin: 6, holdCreep: 0.08,  // while she waits on an answer the clock creeps, never past next text - 6 min
      followUpSec: [1.2, 2.6], // gap between multi-line replies
      longPauseMult: 2.2,
      // Her thinking time before she starts typing a reply, by the type of thing Sora said.
      // sec: [min,max] real seconds · hes: chance to start/stop/start typing · long: chance of a long pause (×longPauseMult)
      think: {
        wholesome:   { sec: [1.0, 2.2], hes: 0.05, long: 0.05 },
        encouraging: { sec: [2.0, 4.0], hes: 0.35, long: 0.15 },

    // for a clean run with no phone stops (see report). legTiles = path distance band (tiles) between stops.
    bikeMaxSpeed: 130, bikeAccel: 170, bikeTurnRate: 4.2, bikeCornerBrake: 260, walkSpeed: 70, handoverSec: 1.4,
    firstLegScale: 0.6,   // leg 1 starts at the central hub, so its band is scaled down

window.DAYS = window.DAYS || {};
window.DAYS[1] = {

      { id: "breakfast", spot: "stove", slots: ["morning"], label: "🍳 Make breakfast", dur: 4, setFlag: "d1_breakfast", st: "plate",

      { id: "dinner", spot: "stove", slots: ["evening"], label: "🍜 Make dinner", dur: 5, setFlag: "d1_dinner", st: "plate",

          choicesByFlag: { flag: "d1_dinner",

      { id: "coffee", spot: "kettle", slots: ["morning"], label: "☕ Make coffee", dur: 3, icon: "☕", st: "mug", stVal: "coffee",

<script>
// Clip player + EDI wrapper. LAPTOP_MEDIA is false unless the laptop index sets it before this script.
window.LAPTOP_MEDIA = !!window.LAPTOP_MEDIA;
window.TG_EDI = (function () { // same pattern as Loop Guard build/js/edi.js
  const LS_URL = 'tg-edi-url', LS_MUTE = 'tg-edi-mute', DEFAULT_URL = 'http://localhost:5000';
  let url = localStorage.getItem(LS_URL) || DEFAULT_URL, muted = localStorage.getItem(LS_MUTE) === '1';
  const base = () => (url || DEFAULT_URL).replace(/\/$/, '');
  function fire(p) { if (!window.LAPTOP_MEDIA || muted) return Promise.resolve(); const h = base() + p;
    return fetch(h, { method: 'POST', mode: 'no-cors' }).catch(() => fetch(h, { method: 'GET', mode: 'no-cors' }).catch(() => {})); }
  const play = n => { if (n) fire('/Edi/Play/' + encodeURIComponent(n)); };
  const stop = () => fire('/Edi/Stop');
  const idle = () => (muted ? stop() : play('idle'));
  return { play, stop, idle, url: () => url, setUrl: u => { url = u || DEFAULT_URL; localStorage.setItem(LS_URL, url); },
    isMuted: () => muted, setMuted: on => { muted = !!on; localStorage.setItem(LS_MUTE, muted ? '1' : '0'); muted ? stop() : idle(); } };
})();
window.TG_MEDIA = (function () {
  const LS_VP = 'tg-video-path';
  const vpath = () => localStorage.getItem(LS_VP) || window.VIDEO_PATH_DEFAULT || 'media/';
  function resolve(src, route) { // src: source id, {Route: id}, or a SCENE_ name
    if (src && typeof src === 'object') src = src[route] || src.Naive;
    const scene = (window.CLIP_SOURCES || {})[src] || src; return { src, scene };
  }
  let el = null, onDone = null, closed = true;
  function exit(why) { if (closed) return; closed = true; try { TG_EDI.idle(); } catch (e) {} // every exit path → idle()
    if (el) { const v = el.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } el.remove(); el = null; }
    const cb = onDone; onDone = null; if (cb) cb(why); }
  function open(src, route, caption, done) {
    exit('replaced'); const r = resolve(src, route); onDone = done || null; closed = false;
    el = document.createElement('div'); el.id = 'clipview';
    el.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eee;font:14px system-ui';
    const cap = `<div style="margin:8px;opacity:.8">${(caption || '').replace(/[<>&]/g, '')}</div>`;
    const btn = '<button id="clipSkip" style="margin-top:10px;padding:8px 18px">✕ Close / skip</button>';
    if (!window.LAPTOP_MEDIA) {
      el.innerHTML = `<div style="border:2px dashed #888;border-radius:12px;padding:30px 40px;text-align:center;max-width:80vw">🎬 <b>Clip placeholder</b><br><span style="opacity:.7">${r.src}</span>${cap}<div style="opacity:.5;font-size:12px">Clips only play in the laptop build.</div></div>${btn}`;
    } else {
      el.innerHTML = `<video playsinline autoplay controls style="max-width:94vw;max-height:80vh;background:#000"></video>${cap}<div style="opacity:.5;font-size:11px">${r.src} → ${r.scene} (temp stand-in)</div>${btn}`;
      const v = el.querySelector('video'); v.src = vpath() + r.scene + '.mp4';
      v.addEventListener('playing', () => TG_EDI.play(r.scene), { once: true });
      v.addEventListener('ended', () => exit('ended')); v.addEventListener('error', () => { exit('error'); window.toast && toast('Clip failed to load: ' + r.scene); });
      v.play().catch(() => {}); // needs a user gesture; the ▶ tap provides it
    }
    document.body.appendChild(el);
    el.querySelector('#clipSkip').onclick = () => exit('skip');
    document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', k); exit('skip'); } });
  }
  window.addEventListener('beforeunload', () => { if (!closed) TG_EDI.idle(); });
  return { open, exit, resolve, vpath, setVideoPath: p => localStorage.setItem(LS_VP, p) };
})();

</script>

let room = null;

function nearChore() {

  if (!room || room.chore) return;

  if (c.special === 'door') {
    if (S.slot === 'morning') { if (canLeaveMorning()) { if (!S.flags.d1_dressed) toast("You head out in your hoodie. The HayaEats jacket's still in the closet."); toShiftSelect(false); } else toast("Shift's at 13:00. Yui's still texting."); }

  S.lateDone = false; S.harutoDone = false; S.shifts = []; S.earned = 0; S.spent = 0; world = null; hideOverlay(); save(); toMorning();
}
function showEnding() { // Day 7 / CP8: Visit 3-beat climax, clips per §22.3
  const r = S.route, m = S.meters, ab = { Naive: m.L >= 55 ? 'A' : 'B', Desperate: m.N >= 30 ? 'A' : 'B', Guilt: m.L >= 50 ? 'A' : 'B', Encouraged: m.E >= 60 ? 'B' : 'A' }[r] || 'A';
  const cal = window.CLIP_CALENDAR[7], name = (window.ENDINGS[r] || {})[ab] || '';
  const beats = [['Beat 1 · discovery', cal.discovery[r]], ['Beat 2 · centrepiece', cal[ab]], ['Beat 3 · aftermath', cal.aftermath]];
  showOverlay(`<h2>🏁 Ending: ${esc(r)} ${ab}, "${esc(name)}"</h2><p class="muted">[PLACEHOLDER ending text until Day 7 dialogue lands]</p>
    ${beats.map(([l, src]) => photoHTML({ id: l, kind: 'clip', src, caption: `${r} ${ab} · ${l}` })).join('')}
    <div class="row"><button class="primary" id="again">New game</button></div>`);
  $('again').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); world = null; hideOverlay(); toMorning(); };
}
function sleep() {
  if (!canSleep()) return;
  const before = { ...S.meters };
  addM({ I: -2 }, 'story drift CP1'); addM({ N: -5 }, 'sleep decay');
  const ev = evalRoute(); S.routeEval = ev;
  if (ev !== S.route) S.flags.route_warning = ev; // §16.4: deferred one checkpoint, warn in D2
  S.flags.cp1 = S.route; S.flags.desp_cause = despCause();
  const dom = dominantType();
  const refMap = { wholesome: 'Naive', forgiving: 'Guilt', encouraging: 'Encouraged', cold: 'Desperate_absent', jealous: 'Desperate_smothered' };
  const refKey = S.route === 'Desperate' ? 'Desperate_' + despCause() : (ev !== 'Naive' && dom ? refMap[dom] : S.route);
  S.reflection = GD.reflections[refKey] || GD.reflections.Naive;
  S.slot = 'summary'; S.phone.open = false; save(); showSummary(); renderControls();
}
function showSummary() {
  const m = S.meters, s0 = S.startMeters;
  const row = k => { const d = m[k] - s0[k]; return `<tr><td>${{ L: 'Love', I: 'Innocence', E: 'Encourage', N: 'Neglect' }[k]}</td><td>${s0[k]} → <b>${m[k]}</b></td><td class="${(k === 'N' ? -d : d) > 0 ? 'good' : d !== 0 ? 'bad' : ''}">${d > 0 ? '+' : ''}${d}</td></tr>`; };
  const lean = { Naive: S.lean.wholesome, Guilt: S.lean.forgiving, Encouraged: S.lean.encouraging, Desperate: S.lean.cold + S.lean.jealous };
  if (S.day >= 7) return showEnding();
  showOverlay(`<h2>🌙 End of Day ${S.day}</h2><p><i>"${esc(S.reflection)}"</i></p>
    <table class="sum">${S.shifts.map(s => `<tr><td>${s.late ? 'Late' : 'Afternoon'} shift (${s.diff})</td><td colspan="2">${yen(s.total)}</td></tr>`).join('')}
    <tr><td>Earned</td><td colspan="2" class="good">${yen(S.earned)}</td></tr><tr><td>Spent</td><td colspan="2" class="bad">${yen(S.spent)}</td></tr>
    <tr><td>Trip fund</td><td colspan="2"><b>${yen(S.money)}</b> / ${yen(C.tripTarget)}</td></tr></table>
    <h3 style="margin:10px 0 2px">Meters</h3><table class="sum">${['L', 'I', 'E', 'N'].map(row).join('')}</table>
    <p>Route at CP1: <b>${S.route}</b>${S.routeEval !== S.route ? ` <span class="bad">(drifting toward ${S.routeEval}; you'll get a warning on Day 2)</span>` : ''}</p>
    <p class="muted" style="font-size:13px">Lean: Naive ${lean.Naive} · Guilt ${lean.Guilt} · Encouraged ${lean.Encouraged} · Desperate ${lean.Desperate} · Protective 🛡️ ${S.lean.protective} (no route weight)</p>
    <p class="muted">Next: ${esc((window.DAYS[S.day + 1] || {}).title || '')}${(window.DAYS[S.day + 1] || {}).placeholder ? ' (placeholder dialogue)' : ''}</p>
    <div class="row"><button class="primary" id="nextday">Continue to Day ${S.day + 1} ▶</button><button id="again">New game</button></div>`);
  $('nextday').onclick = () => nextDay();
  $('again').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); world = null; hideOverlay(); toMorning(); };
}
function showOverlay(html) { ocard.innerHTML = html; ov.style.display = 'flex'; }
function hideOverlay() { ov.style.display = 'none'; }

/* ---------- controls ---------- */
function renderControls() {
  if (!S) return;
  const inShift = S.slot === 'shift' && world && !world.done;
  const world_ = inShift || S.slot === 'morning' || S.slot === 'evening', touch = matchMedia('(pointer: coarse)').matches;
  $('pad').style.display = world_ && touch ? 'block' : 'none';
  $('actBtn').style.display = world_ && touch ? 'block' : 'none';
  $('phoneBtn').style.display = 'none'; ctrl.innerHTML = '';
}
ctrl.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t) slotAction(t.dataset.a); });
function updateActBtn() {
  const b = $('actBtn');
  if (S && room && (S.slot === 'morning' || S.slot === 'evening')) { const c = nearChore(), lbl = room.chore ? '…' : c ? choreLabel(c).replace(/\s*\(.*\)$/, '') : 'USE';
    if (b.textContent !== lbl) { b.textContent = lbl; b.style.background = c ? '#27ae60' : '#2e3240'; } return; }
  if (!world || world.done) return; const p = world.p;
  const lbl = p.handover > 0 ? 'HANDING OVER' : p.onFoot ? (Math.hypot(p.x - p.bx, p.y - p.by) < 40 ? 'GET ON BIKE' : 'WALK…') : p.speed >= 5 ? 'STOP' : 'GET OFF';
  if (b.textContent !== lbl) { b.textContent = lbl; b.style.background = lbl === 'STOP' ? '#c0392b' : lbl === 'GET OFF' ? '#2e86de' : '#27ae60'; }
}
$('actBtn').addEventListener('pointerdown', e => { e.preventDefault(); action(); });
$('phoneBtn').addEventListener('click', () => { S.phone.open ? closePhone() : openPhone(); });
const pad = $('pad'), knob = $('knob');
function padMove(e) {
  const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2, d = Math.hypot(dx, dy), k = d > max ? max / d : 1;
  joy.x = dx * k / max; joy.y = dy * k / max; if (Math.hypot(joy.x, joy.y) < 0.15) joy.x = joy.y = 0;
  knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); joy.on = true; padMove(e); });
pad.addEventListener('pointermove', e => { if (joy.on) padMove(e); });
const padEnd = () => { joy.on = false; joy.x = joy.y = 0; knob.style.transform = ''; };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
document.addEventListener('touchmove', e => { if (!e.target.closest('.pscroll,.choices,.card,#debug')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k.toLowerCase()] = true;
  if (k === '`' || k === 'F2') { toggleDebug(); e.preventDefault(); }
  else if (k === 'e' || k === ' ') { action(); e.preventDefault(); }
  else if (k === 'Escape') { paused = !paused; if (paused) showOverlay('<h2>⏸ Paused</h2><p class="muted">The world and timers are frozen. Press Esc or tap to resume.</p><button class="primary" id="unp" style="width:100%">Resume</button>'), $('unp').onclick = () => { paused = false; hideOverlay(); renderPhone(true); }; else hideOverlay(); renderPhone(true); }
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- debug ---------- */
let debugOn = false;
const dbgEl = $('debug'), dbgBtn = $('debugBtn');
dbgEl.innerHTML = '<button id="dbgClose" data-dbg="close" aria-label="Close debug">✕ Close</button><div id="dbgBody"></div>';
function setDebug(on) { debugOn = on; dbgEl.style.display = on ? 'block' : 'none'; renderDebug(); }
function toggleDebug() { setDebug(!debugOn); }
// 🐞 opens on long-press (0.5 s) so it's never hit by accident; a quick tap closes it if it's open.
let lpTimer = null, lpFired = false;
dbgBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); lpFired = false;
  if (debugOn) { setDebug(false); lpFired = true; return; }
  lpTimer = setTimeout(() => { lpFired = true; setDebug(true); }, 500); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => dbgBtn.addEventListener(ev, () => clearTimeout(lpTimer)));
dbgBtn.addEventListener('contextmenu', e => e.preventDefault());
// tap outside the panel closes it (and the tap is swallowed so it doesn't hit the game)
document.addEventListener('pointerdown', e => {
  if (!debugOn || dbgEl.contains(e.target) || dbgBtn.contains(e.target)) return;
  e.preventDefault(); e.stopPropagation(); setDebug(false);
  const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
  document.addEventListener('click', swallow, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', swallow, true), 400);
}, true);
// panel actions on pointerdown via delegation (the body re-renders, so per-button handlers get lost on iOS)
dbgEl.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-dbg]'); if (!t) return; e.preventDefault();
  const a = t.dataset.dbg;
  if (a === 'close') setDebug(false);
  else if (a === 'skip') skipAhead();
  else if (a === 'reset') { localStorage.removeItem(SAVE_KEY); location.reload(); }
});
function skipAhead() { // jump to the next thing: land anything being typed and end the current gap
  S.outbox.forEach(e => { e.due = S.rt; e.segs = []; }); if (S.q) S.q.segReal = 1e6; landOutbox();
}
function renderDebug() {
  if (!debugOn || !S) return;
  const m = S.meters, bar = (k, c) => `${k} ${m[k]} <span style="color:#888">(start ${S.startMeters[k]}, ${m[k] - S.startMeters[k] >= 0 ? '+' : ''}${m[k] - S.startMeters[k]})</span><div class="bar"><div style="width:${m[k]}%;background:${c}"></div></div>`;
  const p = S.pending;
  $('dbgBody').innerHTML = `<b>DEBUG</b> · ${S.slot} · ${fmtClock(S.clock)} · rt ${S.rt.toFixed(0)}s · safe:${isSafe()}<br>
    ${bar('L', '#f7a1c4')}${bar('I', '#a7c7ff')}${bar('E', '#ffb36b')}${bar('N', '#999')}
    route_now: <b>${S.route}</b> · rules say: <b>${evalRoute()}</b> · desp_cause: ${despCause()}<br>
    lean → Naive ${S.lean.wholesome} · Guilt ${S.lean.forgiving} · Enc ${S.lean.encouraging} · Desp ${S.lean.cold + S.lean.jealous} (cold ${S.lean.cold}/jealous ${S.lean.jealous}) · 🛡️ ${S.lean.protective} (no weight)<br>
    money ${yen(S.money)} · earned ${yen(S.earned)} · spent ${yen(S.spent)}<br>
    pending key: ${p ? `${p.beat} ${p.fired ? 'shown' : 'waiting for a stop'} · wait ${(S.rt - p.readyRt).toFixed(0)}s · steps ${p.steps}` : '—'}<br>
    typing: ${typingChats().join(', ') || '—'} · composing ${S.outbox.length}<br>
    queued keys: ${S.keyQueue.join(', ') || '—'} · open minors: ${S.minors.map(x => x.beat + (x.deadline ? '(' + Math.ceil(x.deadline - S.rt) + 's)' : '')).join(', ') || '—'}<br>
    flags: ${esc(JSON.stringify(S.flags))}<br>
    <div class="row" style="margin:8px 0"><button data-dbg="skip">⏭ Skip wait</button><button data-dbg="reset">Reset save</button></div>
    <div style="color:#aaa">${S.log.slice(-12).reverse().map(esc).join('<br>')}</div>`;
}

/* ---------- title ---------- */
function title() {
  S = S || newState();
  const saved = load();
  showOverlay(`<h2>Last Train Home</h2><p class="muted">Day 1 · Move-in. Yui's moving to Tokyo for uni. You're staying in Minase, doing HayaEats deliveries to save ${yen(C.tripTarget)} so you can visit her.</p>
    <p class="muted" style="font-size:13px">Personal prototype. Placeholder art. Progress saves on this device.</p>
    <p class="muted" style="font-size:11px;opacity:.7" id="buildStamp">2026-10-16 12:12 BST · day1 web</p>
    <div class="diff">${saved && saved.slot !== 'title' ? '<button class="primary" id="cont">Continue</button>' : ''}<button ${saved && saved.slot !== 'title' ? '' : 'class="primary"'} id="newg">New game</button></div>`);
  if ($('cont')) $('cont').onclick = () => { S = saved; resume(); };
  $('newg').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); hideOverlay(); toMorning(); };
}
function resume() {
  hideOverlay();
  if (S.slot === 'shift' || S.slot === 'shift_select') { S.slot = 'shift_select'; S.q = null; toShiftSelect(false); return; } // a shift restarts on reload
  if (S.slot === 'summary') { showSummary(); renderControls(); return; }
  if (S.slot === 'morning' || S.slot === 'evening') startRoom(S.slot);
  renderPhone(true); renderControls();
}

/* ---------- main loop ---------- */
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  const rotated = matchMedia('(orientation: portrait) and (max-width: 900px)').matches;
  if (S && !paused && !rotated && ov.style.display !== 'flex') {
    if (S.slot === 'morning' || S.slot === 'evening') tickRoom(dt);
    if (S.slot === 'morning' || S.slot === 'evening' || S.slot === 'shift') {
      S.rt += dt; if (S.slot === 'shift') tickShift(dt);
      tickQueue(dt); tickTimers(); landOutbox();
    }
  }
  if (S && S.slot === 'evening' && S.q && S.q.slot === 'evening') S.eveningQ = S.q;
  updateActBtn(); renderKeyHint();
  draw();
  renderTypingPill(); uiTimer += dt; if (uiTimer > 0.25) { uiTimer = 0; renderPhone(); renderDebug(); }
  saveTimer += dt; if (saveTimer > 3) { saveTimer = 0; if (S && S.slot !== 'title') save(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
window.__game = { skipAhead, tickShift, get room() { return room; }, roomAction, get S() { return S; }, get world() { return world; }, answer, action, startShift, sleep, toShiftSelect, keys, joy, nextDay, showSummary, showEnding, newState, setS: v => { S = v; } };
resize(); title(); requestAnimationFrame(frame);
})();

</script>
